name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[test]" ruff
      - name: Lint
        run: ruff check openwarden tests examples scripts
      - name: Test
        run: python -m pytest -q

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build
        run: python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      - name: Verify wheel contents
        run: python scripts/check_distributions.py dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/openwarden-wheel
          /tmp/openwarden-wheel/bin/pip install dist/*.whl
          /tmp/openwarden-wheel/bin/python -c "from openwarden import GuardedOpenAI, GuardedPyTorch, __version__; assert __version__ == '0.1.0'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openwarden-distributions
          path: dist/
          if-no-files-found: error
